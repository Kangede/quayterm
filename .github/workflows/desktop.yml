name: Desktop validation and packages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build
      - name: Verify native paths and terminal behavior
        run: node --test tests/workspace.test.cjs tests/local-files.test.cjs tests/terminal-display.test.cjs
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-sftp-server tmux screen xvfb
          QUAYTERM_SFTP_SERVER=/usr/lib/openssh/sftp-server QUAYTERM_TMUX=/usr/bin/tmux npm test
          QUAYTERM_SFTP_SERVER=/usr/lib/openssh/sftp-server QUAYTERM_TMUX=/usr/bin/tmux xvfb-run -a npx playwright test
      - if: runner.os != 'Linux'
        name: Verify native desktop SSH and clipboard
        run: npx playwright test tests/desktop-smoke.e2e.cjs
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'macOS'
        run: npm run dist:mac -- --arm64 --x64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: QuayTerm-diagnostics-${{ runner.os }}
          path: |
            test-results/
            .private/e2e-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: QuayTerm-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
